config_version = 14

[audio]
enable_sounds = true

[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    capsule_padding = 8.0
    capsule_radius = 10
    center = [ "group:g2", "clock", "weather", "recorder" ]
    color = "primary"
    end = [ "cat", "tray", "clipboard", "battery", "cpu", "ram", "notifications", "control-center", "group:g1" ]
    font_scale = 0.89999998733401299
    font_weight = 600
    margin_ends = 0
    padding = 8
    radius = 10
    radius_top_left = 0
    radius_top_right = 0
    start = [ "launcher", "bar", "workspaces", "active_window" ]
    thickness = 36
    widget_spacing = 4

        [bar.default.dead_zone.actions]
        scroll_down = "workspace-switch next"
        scroll_left = "exec niri msg action focus-column-right || umbriel msg window-focus-right"
        scroll_right = "exec niri msg action focus-column-left || umbriel msg window-focus-left"
        scroll_up = "workspace-switch prev"

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "network", "bluetooth", "volume" ]
        opacity = 1.0
        padding = 8.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "audio_visualizer", "media" ]
        opacity = 1.0
        padding = 8.0

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

    [calendar.account.personal_icloud]
    color = "primary"
    name = "iCloud"
    provider = "icloud"
    type = "caldav"
    username = "jms101106@gmail.com"

[control_center]
sidebar = "full"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
enabled = true
pinned = [ "zen", "vesktop", "steam" ]
reserve_space = false
show_dots = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@WL-1", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 1006.4003295898438
    output = "DP-1"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@WL-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 504.0
    cy = 914.0
    output = "WL-1"
    placement_height = 1096.0
    placement_width = 1008.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WL-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.69999998435378075
history_retention_hours = 2
keep_dismissed_in_history = false
layer = "overlay"

[plugin_settings."noctalia/screen_recorder"]
audio_source = "both"
copy_to_clipboard = true
frame_rate = 30
replay_duration = 45
replay_enabled = true
restore_portal = true

[plugins]
enabled = []

[shell]
app_icon_color = "on_surface"
font_family = "CaskaydiaCove NF"
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "default"
polkit_agent = true
umbriel_overview_type_to_launch_enabled = true

    [shell.panel]
    open_near_click_control_center = true
    transparency_mode = "glass"

    [shell.screenshot]
    confirm_region = true
    directory = "/home/hikiru/Pictures/Screenshots"
    remember_last_region = true

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Rosé Pine"
community_palette = "Rose Pine Alt"
source = "community"

[wallpaper]
directory = "/home/hikiru/Pictures/Wallpapers/rose-pine"
transition = [ "disc" ]

    [wallpaper.automation]
    enabled = true
    interval_seconds = 300
    order = "alphabetical"
    recursive = false

    [wallpaper.default]
    path = "/home/hikiru/Pictures/Wallpapers/rose-pine/kinta.png"

    [wallpaper.last]
    path = "/home/hikiru/Pictures/Wallpapers/rose-pine/kinta.png"

    [wallpaper.monitors.DP-1]
    path = "/home/hikiru/Pictures/Wallpapers/rose-pine/kinta.png"

    [wallpaper.monitors.poob]
    path = "/home/hikiru/Pictures/Wallpapers/rose-pine/aira.png"

[weather]
unit = "imperial"

[widget.audio_visualizer]
bands = 3
show_when_idle = true
width = 32

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.brightness]
show_label = false

[widget.cat]
audio_spectrum = true
type = "noctalia/bongocat:cat"

[widget.clock]
anchor = true
format = "{:%I:%M:%S %p} • {:%a %d}"

[widget.control-center]
glyph = "menu-2"

[widget.launcher]
glyph = "noctalia"

[widget.media]
max_length = 200
scroll_repeat = "steps"

    [widget.media.actions]
    scroll_down = "exec playerctl volume 0.05-"
    scroll_up = "exec playerctl volume 0.05+"

[widget.network]
show_label = false

[widget.ram]
label_show_units = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.volume]
show_label = false

[widget.workspaces]
active_pill_size = 2.0
empty_color = "outline"
inactive_pill_size = 1.25
labels_only_when_occupied = true
occupied_color = "outline"
pill_scale = 0.90000000000000002
show_labels = false